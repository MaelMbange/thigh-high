[workspace]
resolver = "3"
members = ["crates/core", "crates/tui", "crates/android"]
# `cargo run` at the root still starts the terminal app.
default-members = ["crates/tui"]

[workspace.package]
version = "0.8.4"
edition = "2024"

[workspace.dependencies]
eyre = "0.6.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25.4"
rustfft = "6.4.1"
tract-onnx = "0.23.8"

# Audio code runs in real time: optimize dependencies even in debug builds so
# `cargo run` doesn't stutter. Release builds (`cargo run --release`) are fastest.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
